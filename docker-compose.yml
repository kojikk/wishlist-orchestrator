services:
  app:
    build: .
    container_name: wishlist-orchestrator
    restart: unless-stopped
    ports:
      - "3060:3000"     # прямой доступ во время разработки; продакшен ходит через caddy в ~/ingress
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      # Docker-функции админки: lifecycle, логи, обновления, провижининг
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    networks:
      - wishnet
      - ingress   # для пуша Caddyfile в caddy admin API (caddy:2019)

networks:
  wishnet:
    name: wishnet
  ingress:
    name: ingress
    external: true
