services:
  app:
    build: .
    container_name: wishlist-orchestrator
    restart: unless-stopped
    ports:
      - "3060:3000"     # прямой доступ во время разработки; продакшен ходит через caddy
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    env_file:
      - .env
    networks:
      - wishnet
    depends_on:
      - caddy

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      # 443 не нужен — SSL терминирует Cloudflare (orange cloud).
      # Если хочешь прямой TLS без Cloudflare: раскомментируй и задай CADDY_ACME_EMAIL в .env
      # - "443:443"
      # - "443:443/udp"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./proxy/data:/data
      - ./proxy/config:/config
    networks:
      - wishnet

networks:
  # name: wishnet — фиксированное имя без префикса compose-проекта.
  # Эта сеть создаётся при первом `docker compose up` оркестратора, остальные
  # стеки (wishlist-app) присоединяются к ней как external.
  wishnet:
    name: wishnet
