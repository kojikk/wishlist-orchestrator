<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вишлисты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Onest:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
  body { padding: 0 24px; }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: clamp(48px, 10vh, 96px) 0 56px;
  }

  header { margin-bottom: 40px; }
  h1 { font-size: clamp(26px, 5vw, 34px); margin-bottom: 8px; }
  h1 em { color: var(--ac); font-style: normal; }
  .sub { color: var(--tx2); font-size: 14px; max-width: 44ch; }

  .cards { display: flex; flex-direction: column; gap: 10px; }

  .item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
    color: var(--tx);
    transition: border-color .18s, background .18s;
  }
  .item:hover { text-decoration: none; border-color: var(--abr); background: var(--sf2); }

  .mono-mark {
    flex: none;
    width: 44px; height: 44px;
    border-radius: 10px;
    display: grid; place-items: center;
    font: 600 17px/1 var(--display);
    color: var(--ac);
    background: var(--adim);
    border: 1px solid var(--abr);
  }

  .item .info { min-width: 0; flex: 1; }
  .item .title {
    font-weight: 600;
    font-size: 15px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .item .meta {
    margin-top: 3px;
    display: flex; align-items: center; flex-wrap: wrap; gap: 4px 14px;
    font-size: 12px; color: var(--tx2);
  }
  .item .meta span { display: inline-flex; align-items: center; gap: 6px; }
  .item .meta .host { color: var(--tx3); }

  .item .arrow {
    color: var(--tx3);
    font-size: 16px;
    transition: transform .18s, color .18s;
  }
  .item:hover .arrow { transform: translateX(4px); color: var(--ac); }

  .skeleton {
    height: 82px;
    border-radius: 12px;
    background: linear-gradient(100deg, var(--sf) 40%, var(--sf2) 50%, var(--sf) 60%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }

  .empty, .error { padding: 32px 20px; text-align: center; color: var(--tx2); font-size: 13px; }

  footer {
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid var(--br);
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; color: var(--tx3);
  }
  footer a { color: var(--tx2); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 data-anim>Вишлисты<em>.</em></h1>
    <p class="sub" data-anim>Все вишлисты в одном месте. Брони видны гостям, но не владельцу — сюрприз остаётся сюрпризом.</p>
  </header>

  <main class="cards" id="cards">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </main>

  <footer data-anim>
    <span>wishlist orchestrator</span>
    <a href="/admin">Админка</a>
  </footer>
</div>

<script src="/vendor/gsap.min.js"></script>
<script>
const cardsEl = document.getElementById('cards');

const statusMeta = (s) => ({
  ok:           { cls: 'ok',   text: 'онлайн' },
  error:        { cls: 'err',  text: 'недоступен' },
  incompatible: { cls: 'warn', text: 'несовместим' },
  idle:         { cls: '',     text: 'проверяем' },
}[s] || { cls: '', text: s });

const plural = (n, one, few, many) => {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
};

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, m =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m]));

function render(instances) {
  if (!instances.length) {
    cardsEl.innerHTML = '<div class="card empty">Пока ни одного вишлиста. Загляните в <a href="/admin">админку</a>.</div>';
    return;
  }
  cardsEl.innerHTML = instances.map(i => {
    const st = statusMeta(i.status);
    const letter = (i.title || i.label || i.id).trim().charAt(0).toUpperCase();
    const count = i.status === 'ok'
      ? `<span>${i.itemCount} ${plural(i.itemCount, 'желание', 'желания', 'желаний')}</span>` : '';
    return `
      <a class="item card" href="${esc(i.publicUrl)}" data-anim>
        <div class="mono-mark">${esc(letter)}</div>
        <div class="info">
          <div class="title">${esc(i.title || i.label)}</div>
          <div class="meta">
            <span><i class="dot ${st.cls}"></i>${st.text}</span>
            ${count}
            <span class="host">${esc(i.host || '')}</span>
          </div>
        </div>
        <span class="arrow">&rarr;</span>
      </a>`;
  }).join('');
  if (window.gsap) {
    gsap.from('#cards .item', {
      y: 14, autoAlpha: 0, duration: .55, stagger: .07, ease: 'power2.out', clearProps: 'all',
    });
  }
}

fetch('/api/instances')
  .then(r => r.json())
  .then(d => render(d.instances || []))
  .catch(() => {
    cardsEl.innerHTML = '<div class="card error">Не удалось загрузить список — попробуйте обновить страницу.</div>';
  });

if (window.gsap) {
  gsap.from('[data-anim]', {
    y: 12, autoAlpha: 0, duration: .6, stagger: .1, ease: 'power2.out', clearProps: 'all',
  });
}
</script>
</body>
</html>
